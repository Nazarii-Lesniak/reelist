name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      TMDB_READ_ACCESS_TOKEN: ci-placeholder-tmdb-token
      DATABASE_URL: postgresql://ci:ci@localhost:5432/reelist?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-placeholder-client-id
      GOOGLE_CLIENT_SECRET: ci-placeholder-client-secret
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint rules
        run: npm run check

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Check Feature-Sliced Design boundaries
        run: npm run steiger

      - name: Build for production
        run: npm run build
