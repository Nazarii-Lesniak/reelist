name: Development task
description: Track a scoped change to Reelist. Use conventional commit types (feat, fix, chore, docs, refactor).
title: "type: short description"
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Describe one deliverable that can be implemented and reviewed in a pull request.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this change accomplish?
      placeholder: Describe the intended result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that mean the task is complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Add implementation context, dependencies, or links.
      render: markdown
    validations:
      required: false
